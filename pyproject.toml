[tool.poetry]
name = "boto3-aws"
version = "0.1.0"
description = "BTU boto3 / AWS practice project"
authors = ["Tornike <tornikegerkena02@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
boto3 = "^1.35"
python-dotenv = "^1.0.0"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tornike</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --text: #16181d;
        --muted: #6b7280;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --text: #e8eaee;
          --muted: #9aa1ad;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 3rem;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tornike</h1>
      <p>Static page hosted on Amazon S3</p>
    </main>
  </body>
</html>
